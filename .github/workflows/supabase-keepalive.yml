name: Supabase Keep-Alive

on:
  schedule:
    # Martes y viernes a las 09:00 UTC (complementa al Cron de Vercel de lunes y jueves)
    - cron: '0 9 * * 2,5'
  workflow_dispatch:

jobs:
  ping-keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/keepalive on Vercel
        run: |
          curl -sS -w "\nHTTP %{http_code}\n" "https://garmin-strength.vercel.app/api/keepalive"
